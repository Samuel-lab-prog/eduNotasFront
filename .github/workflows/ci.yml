name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build Docker image
        run: docker build --build-arg VITE_API_URL=/api --tag edunotas-frontend:ci .

      - name: Smoke test Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name edunotas-frontend-ci --publish 10000:10000 edunotas-frontend:ci
          trap 'docker rm --force edunotas-frontend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:10000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:10000/healthz | grep -q '^ok$'
          curl --fail --silent http://127.0.0.1:10000/estudantes | grep -qi 'EduNotas'
