name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Install Playwright browser
        run: bunx playwright install chromium --with-deps

      - name: Run browser flow tests
        shell: bash
        run: |
          set -euo pipefail
          bun run dev -- --host 127.0.0.1 > vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
          bun run test:e2e

      - name: Build frontend
        run: bun run build

      - name: Build Docker image
        run: docker build --build-arg VITE_API_BASE_URL=/api --tag edunotas-frontend:ci .

      - name: Smoke test Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name edunotas-frontend-ci --publish 10000:10000 edunotas-frontend:ci
          trap 'docker rm --force edunotas-frontend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:10000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:10000/healthz | grep -q '^ok$'
          curl --fail --silent http://127.0.0.1:10000/estudantes | grep -qi 'EduNotas'
